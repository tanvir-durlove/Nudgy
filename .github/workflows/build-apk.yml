name: Build Nudgy Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a downloadable GitHub Release (direct APK download)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Environment Secrets (.env)
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY from GitHub Secrets..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ ! -f .env ]; then
            echo "Using default .env.example..."
            cp .env.example .env
          fi

      - name: Restore Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fallback debug keystore..."
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare & Verify APK Output
        run: |
          mkdir -p build-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/nudgy.apk
            cp app/build/outputs/apk/debug/app-debug.apk build-apks/nudgy-debug.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} build-apks/nudgy.apk \;
            cp build-apks/nudgy.apk build-apks/nudgy-debug.apk
          fi
          echo "Verifying APK integrity..."
          unzip -t build-apks/nudgy.apk | tail -n 5
          ls -lh build-apks/

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudgy-android-apk
          path: build-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Direct Download)
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "Publishing release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" build-apks/nudgy.apk build-apks/nudgy-debug.apk \
            --title "Nudgy Android APK ($TAG_NAME)" \
            --notes "### Nudgy — Things Get Done ✨
          Directly download the ready-to-install Android APK below:
          - **nudgy.apk** / **nudgy-debug.apk** (Package: \`com.aistudio.nudgy.prod\`)
          - Fully signed with debug keystore.
          - Compatible with Android 7.0+ (API 24 to 36)." \
            --draft=false \
            --prerelease=false || gh release upload "$TAG_NAME" build-apks/nudgy.apk build-apks/nudgy-debug.apk --clobber || true
